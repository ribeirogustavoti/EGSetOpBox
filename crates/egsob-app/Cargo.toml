# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "egsob-app"
description = "Application binary: Slint UI on KMS/DRM with libmpv render (OpenGL ES)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "egsob"
path = "src/main.rs"

[dependencies]
egsob-core.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "backend-linuxkms", "renderer-femtovg"] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
