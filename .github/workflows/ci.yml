# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04-arm
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf -y install git gcc rustup

      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: |
          rustup-init -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          "$HOME/.cargo/bin/rustup" toolchain install "$channel" --profile minimal --component rustfmt --component clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  toolchain:
    name: rust-toolchain.toml matches Fedora 44 rust
    runs-on: ubuntu-24.04-arm
    container: fedora:44
    steps:
      - uses: actions/checkout@v6

      - name: Compare the pinned toolchain with Fedora 44's rust package
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          fedora="$(dnf -q repoquery --latest-limit 1 --queryformat '%{version}' rust)"
          echo "pinned: $pinned / Fedora 44 rust: $fedora"
          if [ "$pinned" != "$fedora" ]; then
            echo "::error file=rust-toolchain.toml::pins $pinned but Fedora 44 ships rust $fedora"
            exit 1
          fi

  limits:
    name: code limits
    runs-on: ubuntu-24.04-arm
    container: fedora:44
    steps:
      - name: Install limit tools
        run: |
          dnf -y install git jq tokei python3-pip
          pip install --user lizard==1.23.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v6

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check code limits
        run: scripts/check-limits.sh
